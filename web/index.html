<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業管理系統 - 登入</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 日式簡約配色方案 */
        :root {
            --bg-color: #f7f3f0;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #8c8c8c;
            --border-color: #e0dcd9;
            --accent-wood: #a67c52; /* 溫暖的木質色 */
            --input-focus: #899481; /* 苔蘚綠 */
        }

        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-color); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
            color: var(--text-main);
        }

        .login-card { 
            background: var(--card-bg); 
            padding: 50px 40px; 
            border-radius: 4px; /* 直角感更顯簡約 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            width: 380px; 
            text-align: center; 
            border: 1px solid var(--border-color);
        }

        h2 { 
            font-weight: 500; 
            margin-bottom: 30px; 
            letter-spacing: 2px; 
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .input-group { text-align: left; margin-bottom: 25px; }
        
        .input-group label { 
            display: block; 
            margin-bottom: 10px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            letter-spacing: 1px;
        }

        .input-group input { 
            width: 100%; 
            padding: 12px 0; 
            border: none; 
            border-bottom: 1px solid var(--border-color); 
            border-radius: 0;
            box-sizing: border-box; 
            font-size: 1rem; 
            background: transparent;
            transition: border-color 0.3s;
            outline: none;
        }

        .input-group input:focus { 
            border-bottom: 1px solid var(--accent-wood); 
        }

        .btn-login { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--accent-wood); 
            color: white; 
            border: none; 
            border-radius: 2px; 
            font-size: 1rem; 
            letter-spacing: 2px;
            cursor: pointer; 
            transition: opacity 0.3s; 
            margin-top: 10px;
        }

        .btn-login:hover { 
            opacity: 0.85; 
        }

        .loading { opacity: 0.5; pointer-events: none; }

        /* 頁腳小字樣式 */
        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="login-card" id="login-box">
    <h2>企業系統登入</h2>
    <div class="input-group">
        <label>電子郵件 / Email</label>
        <input type="email" id="email" placeholder="user@company.com" spellcheck="false">
    </div>
    <div class="input-group">
        <label>密碼 / Password</label>
        <input type="password" id="password" placeholder="請輸入密碼">
    </div>
    <button class="btn-login" id="login-btn" onclick="handleLogin()">登入系統</button>
    <div class="footer-note">© 2026 企業內部管理系統</div>
</div>

<script src="js/supabase.js"></script>
<script>
    async function handleLogin() {
        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');

        if (!emailInput || !passwordInput) return alert("請輸入完整登入資訊");

        btn.innerText = "驗證中...";
        document.getElementById('login-box').classList.add('loading');

        try {
            const { data: user, error } = await _supabase
                .from('employees')
                .select('*')
                .eq('email', emailInput)
                .single();

            if (error || !user) {
                alert("此帳號不存在");
            } else if (user.password !== passwordInput) {
                alert("登入驗證失敗");
            } else {
                // 登入成功，儲存所有必要欄位
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', user.full_name);
                localStorage.setItem('userRole', user.role);
                localStorage.setItem('employeeId', user.employee_id);
                localStorage.setItem('department', user.department);

                window.location.href = "portal.html";
            }
        } catch (err) {
            alert("系統連線異常，請稍後再試");
        } finally {
            btn.innerText = "登入系統";
            document.getElementById('login-box').classList.remove('loading');
        }
    }

    // 支援 Enter 鍵登入
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>
</body>
</html>
