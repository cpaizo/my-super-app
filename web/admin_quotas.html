<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特休額度管理 - 企業管理系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <style>
        body { padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .quota-card { border: 1px solid #eee; padding: 20px; border-radius: 10px; margin-top: 20px; background: #fafafa; }
        .flex-row { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 1fr; gap: 10px; align-items: flex-end; }
        mark { padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        .status-tag { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; background: #e0e0e0; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <hgroup>
                <h1>⚖️ 特休額度管理</h1>
                <p>查詢並設定員工各年度假別總額度</p>
            </hgroup>
            <button class="outline" onclick="location.href='portal.html'">回主選單</button>
        </header>

        <section>
            <label for="employee-select">👤 選擇員工：</label>
            <select id="employee-select" onchange="fetchUserQuotas()">
                <option value="">-- 請選擇員工 --</option>
            </select>
        </section>

        <div id="quota-display-area" style="display: none;">
            <div class="quota-card">
                <h3>📊 <span id="target-name"></span> 的額度概況</h3>
                <p>帳號：<code id="target-email"></code></p>
                <hr>
                
                <table role="grid">
                    <thead>
                        <tr>
                            <th>年度</th>
                            <th>假別</th>
                            <th>總額度 (hr)</th>
                            <th>已使用 (hr)</th>
                            <th>剩餘 (hr)</th>
                        </tr>
                    </thead>
                    <tbody id="quota-table-body">
                        </tbody>
                </table>

                <hr>
                <h4>➕ 設定/調整額度</h4>
                <div class="flex-row">
                    <div>
                        <label>假別</label>
                        <select id="new-leave-type">
                            <option value="Annual">特休 (Annual)</option>
                            <option value="Sick">病假 (Sick)</option>
                            <option value="Personal">事假 (Personal)</option>
                            <option value="Compensatory">補休 (Compensatory)</option>
                        </select>
                    </div>
                    <div>
                        <label>年度</label>
                        <input type="number" id="new-year" placeholder="2026">
                    </div>
                    <div>
                        <label>總額度 (小時)</label>
                        <input type="number" id="new-total" placeholder="例如: 56">
                    </div>
                    <button onclick="updateQuota()">儲存</button>
                </div>
                <small style="color: #666;">* 系統會根據「Email + 年度 + 假別」自動判斷為更新或新增。</small>
            </div>
        </div>
    </div>

    <script>
        // 設定預設年度為今年
        const currentYear = new Date().getFullYear();
        document.getElementById('new-year').value = currentYear;

        window.onload = async function() {
            const select = document.getElementById('employee-select');
            try {
                // 從 employees 表撈取名單
                const { data: employees, error } = await _supabase
                    .from('employees')
                    .select('full_name, email')
                    .order('full_name', { ascending: true });

                if (error) throw error;

                employees.forEach(emp => {
                    const opt = document.createElement('option');
                    opt.value = emp.email;
                    opt.innerText = `${emp.full_name} (${emp.email})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                alert("無法載入員工清單: " + err.message);
            }
        };

        // 查詢員工額度 (對齊 total_hours, used_hours 欄位)
        async function fetchUserQuotas() {
            const email = document.getElementById('employee-select').value;
            const displayArea = document.getElementById('quota-display-area');
            const tableBody = document.getElementById('quota-table-body');
            
            if (!email) {
                displayArea.style.display = 'none';
                return;
            }

            const selectEl = document.getElementById('employee-select');
            document.getElementById('target-name').innerText = selectEl.options[selectEl.selectedIndex].text.split(' (')[0];
            document.getElementById('target-email').innerText = email;

            try {
                const { data: quotas, error } = await _supabase
                    .from('leave_quotas')
                    .select('*')
                    .eq('user_email', email)
                    .order('year', { ascending: false });

                if (error) throw error;

                displayArea.style.display = 'block';
                
                if (!quotas || quotas.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">此員工尚無任何額度紀錄</td></tr>';
                } else {
                    tableBody.innerHTML = quotas.map(q => {
                        const total = q.total_hours || 0;
                        const used = q.used_hours || 0;
                        const remaining = total - used;
                        return `
                            <tr>
                                <td>${q.year}</td>
                                <td><strong>${q.leave_type}</strong></td>
                                <td>${total}</td>
                                <td>${used}</td>
                                <td><mark style="background: ${remaining > 0 ? '#d4edda' : '#f8d7da'}">${remaining}</mark></td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) {
                alert("查詢失敗: " + err.message);
            }
        }

        // 儲存或更新額度 (解決 Column Not Found 與 NaN 問題)
        async function updateQuota() {
            const email = document.getElementById('employee-select').value;
            const leaveType = document.getElementById('new-leave-type').value;
            const year = parseInt(document.getElementById('new-year').value);
            const totalHours = parseFloat(document.getElementById('new-total').value);

            if (!email) return alert("請先選擇員工");
            if (isNaN(year)) return alert("請輸入有效年度");
            if (isNaN(totalHours) || totalHours < 0) return alert("請輸入有效的總額度時數");

            try {
                // 檢查是否已有該年度、該假別的紀錄
                const { data: existing, error: findError } = await _supabase
                    .from('leave_quotas')
                    .select('id')
                    .eq('user_email', email)
                    .eq('leave_type', leaveType)
                    .eq('year', year)
                    .maybeSingle();

                if (findError) throw findError;

                let response;
                if (existing) {
                    // 更新現有資料
                    response = await _supabase
                        .from('leave_quotas')
                        .update({ 
                            total_hours: totalHours,
                            updated_at: new Date() 
                        })
                        .eq('id', existing.id);
                } else {
                    // 新增資料
                    response = await _supabase
                        .from('leave_quotas')
                        .insert([{ 
                            user_email: email, 
                            leave_type: leaveType, 
                            total_hours: totalHours,
                            used_hours: 0,
                            year: year
                        }]);
                }

                if (response.error) throw response.error;

                alert("✅ 額度設定成功！");
                document.getElementById('new-total').value = ''; // 清空輸入框
                fetchUserQuotas(); // 刷新表格
            } catch (err) {
                alert("❌ 儲存失敗：" + err.message);
            }
        }
    </script>
</body>
</html>
