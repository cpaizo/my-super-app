<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請假紀錄明細 - 企業管理系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <style>
        body { padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .pending { background: #fff3e0; color: #ef6c00; }
        .approved { background: #e8f5e9; color: #2e7d32; }
        .rejected { background: #ffebee; color: #c62828; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; align-items: end; }
        table th, table td { vertical-align: middle; }
        .time-cell { font-family: monospace; font-size: 0.85rem; line-height: 1.2; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <hgroup>
                <h1>📅 請假紀錄明細</h1>
                <p>查看歷史請假資訊與審核狀態</p>
            </hgroup>
            <nav>
                <ul>
                    <li><button class="outline" onclick="location.href='portal.html'">返回主選單</button></li>
                </ul>
            </nav>
        </header>

        <main class="card">
            <div class="filter-grid">
                <label>假別篩選
                    <select id="filter-type" onchange="filterData()">
                        <option value="全部">全部假別</option>
                        <option value="特休">特休</option>
                        <option value="事假">事假</option>
                        <option value="病假">病假</option>
                        <option value="公假">公假</option>
                    </select>
                </label>
                <label>狀態篩選
                    <select id="filter-status" onchange="filterData()">
                        <option value="全部">全部狀態</option>
                        <option value="pending">待審核</option>
                        <option value="approved">已核准</option>
                        <option value="rejected">已駁回</option>
                    </select>
                </label>
                <div>
                    <button onclick="fetchLogs()" class="secondary">🔄 整理數據</button>
                </div>
            </div>

            <figure>
                <table role="grid">
                    <thead>
                        <tr>
                            <th style="width: 120px;">申請日期</th>
                            <th>員工姓名</th>
                            <th>假別</th>
                            <th style="min-width: 200px;">請假期間</th>
                            <th>總時數</th>
                            <th>狀態</th>
                            <th>原因備註</th>
                        </tr>
                    </thead>
                    <tbody id="log-table">
                        <tr><td colspan="7" aria-busy="true">正在讀取紀錄...</td></tr>
                    </tbody>
                </table>
            </figure>
        </main>
    </div>

    <script>
        const uEmail = localStorage.getItem('userEmail');
        const uRole = localStorage.getItem('userRole'); // admin 或 employee
        let allLogs = [];

        window.onload = function() {
            if (!uEmail) { window.location.href = "index.html"; return; }
            fetchLogs();
        };

        async function fetchLogs() {
            // 基礎查詢
            let query = _supabase.from('leave_requests').select('*').order('created_at', { ascending: false });

            // 安全性過濾：如果不是管理員，強制只能看到自己的資料
            if (uRole !== 'admin') {
                query = query.eq('user_email', uEmail);
            }

            const { data, error } = await query;

            if (error) {
                console.error("資料抓取失敗:", error);
                return;
            }

            allLogs = data;
            renderTable(allLogs);
        }

        function renderTable(list) {
            const tbody = document.getElementById('log-table');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">目前尚無任何請假紀錄。</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(r => {
                const statusMap = { 'pending': '待審核', 'approved': '已核准', 'rejected': '已駁回' };
                
                // 格式化日期與時間
                const createDate = new Date(r.created_at).toLocaleDateString('zh-TW');
                const startTime = new Date(r.start_time).toLocaleString('zh-TW', { 
                    timeZone: 'Asia/Taipei', // 強制指定台北時區
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false 
                });
                const endTime = new Date(r.end_time).toLocaleString('zh-TW', {
                    timeZone: 'Asia/Taipei', // 強制指定台北時區 
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false 
                });

                return `
                <tr>
                    <td>${createDate}</td>
                    <td><strong>${r.user_name || '未知'}</strong><br><small style="color:#666">${r.user_email}</small></td>
                    <td>${r.leave_type}</td>
                    <td class="time-cell">
                        起：${startTime}<br>
                        迄：${endTime}
                    </td>
                    <td><mark>${r.request_hours} 小時</mark></td>
                    <td><span class="status-badge ${r.status}">${statusMap[r.status]}</span></td>
                    <td><small>${r.reason || '-'}</small></td>
                </tr>
                `;
            }).join('');
        }

        function filterData() {
            const type = document.getElementById('filter-type').value;
            const status = document.getElementById('filter-status').value;

            let filtered = allLogs;

            if (type !== '全部') {
                filtered = filtered.filter(i => i.leave_type === type);
            }
            if (status !== '全部') {
                filtered = filtered.filter(i => i.status === status);
            }

            renderTable(filtered);
        }
    </script>
</body>
</html>
