<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統選單 - 企業管理系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { padding: 20px; max-width: 800px; margin: auto; background-color: #f0f2f5; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .user-info { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .admin-section { margin-top: 2rem; padding-top: 2rem; border-top: 2px dashed #eee; }
        .logout-btn { color: #d81b60; border-color: #d81b60; }
        .logout-btn:hover { background-color: #fff1f6; }
        
        /* 針對不同功能的按鈕顏色區分 */
        .btn-attendance { background-color: #3949ab; border-color: #3949ab; }
        .btn-order { background-color: #fb8c00; border-color: #fb8c00; } /* 點餐功能用橘色 */
        .btn-leave { background-color: #43a047; border-color: #43a047; }
        .btn-leave_history { background-color: #5fcf9b; border-color: #5fcf9b; }
        h4 { margin-bottom: 1.5rem; color: #555; }
    </style>
</head>
<body>
    <main class="card">
        <div class="user-info">
            <div>
                <h2 style="margin:0;">👋 你好，<span id="user-name-display">載入中...</span></h2>
                <small id="user-email-display">---</small>
            </div>
            <button class="outline logout-btn" onclick="logout()" style="width: auto; margin:0;">登出</button>
        </div>

        <section>
            <h4>📋 員工功能</h4>
            <div class="menu-grid">
                <button class="btn-attendance" onclick="location.href='attendance.html'">📍 上下班打卡</button>
                <button class="btn-order" onclick="location.href='order_system.html'">🍱 線上點餐</button> <button class="btn-leave" onclick="location.href='leave_apply.html'">✍️ 申請請假</button>
                <button class="secondary" onclick="location.href='history.html'">📊 我的出勤報表</button>
                <button class="btn-leave_history" onclick="location.href='leave_history.html'">📋 我的請假紀錄</button>
            </div>
        </section>

        <section id="admin-panel" class="admin-section" style="display: none;">
            <h4>🛠️ 管理者工具</h4>
            <div class="menu-grid">
                <button onclick="location.href='admin_report.html'">📈 即時考勤監控</button>
                <button onclick="location.href='admin_review.html'" class="secondary">⚖️ 審核請假單</button>
                <button class="btn-leave_history" onclick="location.href='leave_history.html'">📋 請假紀錄查詢</button>
                <button class="outline" onclick="location.href='order_system.html'">🍔 查看今日訂單</button>
                <button class="outline" onclick="location.href='admin_employees.html'">👥 員工資料維護</button>
            </div>
        </section>
    </main>

    <script>
        window.onload = function() {
            const uName = localStorage.getItem('userName');
            const uEmail = localStorage.getItem('userEmail');
            const uRole = localStorage.getItem('userRole');

            if (!uEmail) {
                window.location.href = "index.html";
                return;
            }

            document.getElementById('user-name-display').innerText = uName;
            document.getElementById('user-email-display').innerText = uEmail;

            // 角色判斷
            if (uRole === 'admin') {
                document.getElementById('admin-panel').style.display = 'block';
            }
        };

        function logout() {
            if (confirm("確定要登出系統嗎？")) {
                localStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
